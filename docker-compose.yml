version: '3.8'

services:
  # Сервис с LLM
  ollama:
    image: ollama/ollama:latest
    container_name: local_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Настройка параметров по ТЗ: 1 batch, 1 parallel (через переменные окружения Ollama)
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=1
    # При старте автоматически скачиваем нужную модель (весит ~4.7 GB, помещается в 8GB VRAM)
    entrypoint: >
      /bin/sh -c "ollama serve & sleep 5 && if ! ollama list | grep -q 'qwen2.5-coder:7b'; then ollama pull qwen2.5-coder:7b; fi && wait"

  # Наш Агент
  agent_api:
    build: .
    container_name: lua_agent_api
    ports:
      - "8080:8080"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./app:/app/app

volumes:
  ollama_data: